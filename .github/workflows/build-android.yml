name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Point Gradle at the runner's preinstalled Android SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          test -d "$SDK_ROOT/platforms/android-36" || { echo "::error::expected SDK not found at $SDK_ROOT"; ls -la /usr/local/lib/android 2>&1 || true; exit 1; }
          echo "sdk.dir=$SDK_ROOT" > android/local.properties
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: DoneRight Android build #${{ github.run_number }}
          body: Debug APK built from ${{ github.ref_name }} @ ${{ github.sha }}. Sideload-only (not Play Store signed) — enable "install unknown apps" for your browser/file manager to install.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
